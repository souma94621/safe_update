<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моковый реестр обновлений</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>
        <h1>Моковый реестр обновлений</h1>
        <p class="subtitle">ГОСТ Р 72118, шаблон А.10 «Безопасное обновление»</p>

        <p class="version">Текущая версия: <span id="current-version">—</span></p>

        <button id="check-btn">Проверить обновление</button>
        <button id="rollback-btn" class="secondary">Откатить версию</button>
        <div id="status" class="status"></div>

        <h2>Лог монитора</h2>
        <div id="log" class="log"></div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
